name: Spansh Hotspot Finder

on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Query Spansh and update Google Sheet
        env:
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
        run: python spansh_hotspot_finder.py

      - name: Upload result files
        uses: actions/upload-artifact@v4
        with:
          name: spansh-hotspot-results
          path: |
            spansh_results.csv
            spansh_results_raw.csv
            summary.json
