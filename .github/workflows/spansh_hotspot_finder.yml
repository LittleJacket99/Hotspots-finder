name: Spansh Hotspot Finder

on:
  workflow_dispatch:
    inputs:
      sheet_webapp_url:
        description: "Google Apps Script Web App URL"
        required: false
        type: string

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Query Spansh and update Google Sheet
        env:
          SHEET_WEBAPP_URL: ${{ inputs.sheet_webapp_url || secrets.SHEET_WEBAPP_URL }}
        run: python spansh_hotspot_finder.py

      - name: Upload result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spansh-finder-results
          if-no-files-found: ignore
          path: |
            spansh_results.csv
            spansh_hotspots.csv
            spansh_planets.csv
            summary.json
